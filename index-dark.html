<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUTBOARD — text-to-music console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root{
    /* ---- source palette (colors.xml) ---- */
    --ink:#000000;
    --paper:#FFFFFF;
    --teal:#004D71;
    --crimson:#E0004C;
    --crimson-deep:#C50043;
    --green:#44A400;
    --violet:#95009C;
    --orange:#E02800;
    --dust:#CABAC0;
    --mist:#E5DCDF;

    /* ---- derived surfaces (dark) ---- */
    --bg: var(--ink);
    --surface: color-mix(in srgb, var(--teal) 14%, black 86%);
    --surface-raised: color-mix(in srgb, var(--teal) 22%, black 78%);
    --surface-sunken: color-mix(in srgb, var(--teal) 8%, black 92%);
    --border: color-mix(in srgb, var(--dust) 22%, black 78%);
    --border-strong: color-mix(in srgb, var(--dust) 40%, black 60%);

    --text-primary: var(--paper);
    --text-secondary: var(--dust);
    --text-tertiary: color-mix(in srgb, var(--paper) 45%, transparent);

    --action: var(--crimson);
    --action-hover: var(--crimson-deep);
    --action-text: var(--paper);

    --success: var(--green);
    --ai: var(--violet);
    --warn: var(--orange);
    --idle: color-mix(in srgb, var(--dust) 35%, black 65%);

    --focus-ring: var(--crimson);

    --font-display: 'Fraunces', serif;
    --font-ui: 'Hanken Grotesk', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;

    --radius: 4px;
    --unit: 8px;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text-primary);
    font-family:var(--font-ui);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    background-image:
      repeating-linear-gradient(115deg, color-mix(in srgb, var(--teal) 6%, transparent) 0px, transparent 2px, transparent 40px);
  }

  a{ color:inherit; }
  button{ font-family:inherit; }

  ::selection{ background:var(--action); color:var(--paper); }

  :focus-visible{
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  .eyebrow{
    font-family:var(--font-mono);
    font-size:0.6875rem;
    text-transform:uppercase;
    letter-spacing:0.09em;
    color:var(--text-secondary);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--idle);
    flex:none;
  }

  /* ---------------- shell ---------------- */
  .shell{
    max-width:1240px;
    margin:0 auto;
    padding: calc(var(--unit)*2) calc(var(--unit)*2) calc(var(--unit)*6);
  }

  /* ---------------- header ---------------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: calc(var(--unit)*1.5) calc(var(--unit)*2);
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--surface);
    margin-bottom: calc(var(--unit)*2);
    flex-wrap:wrap;
    gap: var(--unit);
  }
  .wordmark{
    display:flex;
    align-items:baseline;
    gap:12px;
  }
  .wordmark h1{
    font-family:var(--font-display);
    font-style:italic;
    font-weight:500;
    font-optical-sizing:auto;
    font-size:1.875rem;
    margin:0;
    letter-spacing:0.01em;
  }
  .wordmark .sub{
    font-family:var(--font-mono);
    font-size:0.6875rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-secondary);
  }
  .topbar-right{
    display:flex;
    align-items:center;
    gap: calc(var(--unit)*2);
  }
  .pwr{
    display:flex; align-items:center; gap:8px;
    font-family:var(--font-mono);
    font-size:0.6875rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-secondary);
  }
  .pwr .led{
    width:7px;height:7px;border-radius:50%;
    background: var(--success);
    box-shadow: 0 0 6px color-mix(in srgb, var(--success) 70%, transparent);
  }
  .theme-badge{
    font-family:var(--font-mono);
    font-size:0.6875rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-secondary);
    border:1px solid var(--border-strong);
    border-radius:var(--radius);
    padding:4px 10px;
  }

  /* ---------------- rack layout ---------------- */
  .rack{
    display:grid;
    grid-template-columns: 300px 1fr 300px;
    gap: calc(var(--unit)*2);
    align-items:start;
  }
  @media (max-width: 980px){
    .rack{ grid-template-columns: 1fr; }
    .rack .panel-input{ order:1; }
    .rack .panel-master{ order:2; }
    .rack .panel-rack{ order:3; }
  }

  .panel{
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--surface);
    padding: calc(var(--unit)*2);
  }
  .panel + .panel{ margin-top: calc(var(--unit)*2); }
  .panel-title{
    font-family:var(--font-display);
    font-weight:500;
    font-size:1.05rem;
    margin: 4px 0 calc(var(--unit)*2);
  }

  /* ---------------- CH.01 input ---------------- */
  textarea#prompt{
    width:100%;
    min-height:132px;
    resize:vertical;
    background:var(--surface-sunken);
    border:1px solid var(--border);
    border-radius:var(--radius);
    color:var(--text-primary);
    font-family:var(--font-mono);
    font-size:0.85rem;
    line-height:1.6;
    padding:12px;
    margin-top:10px;
  }
  textarea#prompt::placeholder{ color:var(--text-tertiary); }
  textarea#prompt:focus{ border-color: var(--action); }

  .charcount{
    font-family:var(--font-mono);
    font-size:0.6875rem;
    color:var(--text-tertiary);
    text-align:right;
    margin-top:6px;
  }

  .field-group{ margin-top: calc(var(--unit)*2.5); }
  .field-label{
    font-family:var(--font-mono);
    font-size:0.6875rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-secondary);
    margin-bottom:8px;
    display:block;
  }
  .chips{
    display:flex; flex-wrap:wrap; gap:6px;
  }
  .chip{
    font-family:var(--font-ui);
    font-size:0.8125rem;
    font-weight:500;
    padding:6px 12px;
    border:1px solid var(--border-strong);
    border-radius:var(--radius);
    background:transparent;
    color:var(--text-secondary);
    cursor:pointer;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .chip:hover{ border-color: var(--text-secondary); color:var(--text-primary); }
  .chip[aria-pressed="true"]{
    background: var(--teal);
    border-color: var(--teal);
    color: var(--paper);
  }
  .chips[data-group="mood"] .chip[aria-pressed="true"]{
    background: var(--violet);
    border-color: var(--violet);
  }

  /* ---------------- master out ---------------- */
  .panel-master{ text-align:center; }
  .panel-master .panel-title{ text-align:left; }

  .meter{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:4px;
    height:120px;
    padding: 12px;
    background:var(--surface-sunken);
    border:1px solid var(--border);
    border-radius:var(--radius);
    margin-bottom: calc(var(--unit)*2.5);
    overflow:hidden;
  }
  .meter .bar{
    width:6px;
    min-height:4px;
    border-radius:1px;
    background:var(--idle);
    transition: height .18s ease, background-color .18s ease;
  }

  .generate-btn{
    font-family:var(--font-ui);
    font-weight:700;
    font-size:1rem;
    letter-spacing:0.02em;
    color:var(--action-text);
    background:var(--action);
    border:1px solid var(--action);
    border-radius:var(--radius);
    padding:14px 30px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    transition: background-color .12s ease, transform .05s ease;
  }
  .generate-btn:hover{ background:var(--action-hover); border-color:var(--action-hover); }
  .generate-btn:active{ transform: translateY(1px); }
  .generate-btn:disabled{ cursor:progress; opacity:.85; }
  .generate-btn svg{ width:14px; height:14px; }

  .status-line{
    margin-top:14px;
    font-family:var(--font-mono);
    font-size:0.75rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-secondary);
  }
  .status-line .timer{ color:var(--text-primary); }

  /* ---------------- CH.02 rack ---------------- */
  .rack-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top: calc(var(--unit)*2.5);
  }
  .rack-row:first-of-type{ margin-top:0; }
  .rack-row .field-label{ margin:0; min-width:64px; }

  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    flex:1;
    height:20px;
    background:
      repeating-linear-gradient(90deg, var(--border-strong) 0 1px, transparent 1px 12.5%) center / 100% 8px no-repeat,
      var(--surface-sunken);
    border:1px solid var(--border);
    border-radius:2px;
    cursor:pointer;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:12px; height:20px;
    border-radius:2px;
    background:var(--action);
    border:1px solid var(--action-hover);
    cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:12px; height:20px;
    border-radius:2px;
    background:var(--action);
    border:1px solid var(--action-hover);
    cursor:pointer;
  }
  .bpm-value{
    font-family:var(--font-mono);
    font-size:0.85rem;
    color:var(--text-primary);
    width:52px;
    text-align:right;
    flex:none;
  }

  .segmented{
    display:flex;
    border:1px solid var(--border-strong);
    border-radius:var(--radius);
    overflow:hidden;
    flex:1;
  }
  .segmented button{
    flex:1;
    background:transparent;
    border:none;
    border-left:1px solid var(--border-strong);
    color:var(--text-secondary);
    font-family:var(--font-mono);
    font-size:0.75rem;
    padding:8px 0;
    cursor:pointer;
  }
  .segmented button:first-child{ border-left:none; }
  .segmented button[aria-pressed="true"]{
    background:var(--action);
    color:var(--paper);
  }

  select{
    flex:1;
    background:var(--surface-sunken);
    border:1px solid var(--border);
    border-radius:var(--radius);
    color:var(--text-primary);
    font-family:var(--font-mono);
    font-size:0.8rem;
    padding:8px 10px;
    cursor:pointer;
    appearance:none;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-secondary) 50%), linear-gradient(135deg, var(--text-secondary) 50%, transparent 50%);
    background-position: calc(100% - 16px) center, calc(100% - 11px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat:no-repeat;
  }

  .seed-row{ flex:1; display:flex; gap:8px; }
  .seed-row input[type="text"]{
    flex:1;
    background:var(--surface-sunken);
    border:1px solid var(--border);
    border-radius:var(--radius);
    color:var(--text-primary);
    font-family:var(--font-mono);
    font-size:0.8rem;
    padding:8px 10px;
    min-width:0;
  }
  .icon-btn{
    flex:none;
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    border:1px solid var(--border);
    border-radius:var(--radius);
    color:var(--text-secondary);
    cursor:pointer;
  }
  .icon-btn:hover{ color:var(--text-primary); border-color:var(--border-strong); }
  .icon-btn svg{ width:15px; height:15px; }

  .toggle-row{ align-items:center; }
  .toggle{
    position:relative;
    width:44px; height:22px;
    background:var(--surface-sunken);
    border:1px solid var(--border-strong);
    border-radius:2px;
    cursor:pointer;
    flex:none;
    padding:0;
  }
  .toggle .knob{
    position:absolute;
    top:2px; left:2px;
    width:16px; height:16px;
    background:var(--text-secondary);
    border-radius:1px;
    transition: left .14s ease, background-color .14s ease;
  }
  .toggle[aria-pressed="true"]{ border-color: var(--success); }
  .toggle[aria-pressed="true"] .knob{
    left:24px;
    background:var(--success);
  }
  .toggle-label{
    font-family:var(--font-mono);
    font-size:0.75rem;
    color:var(--text-secondary);
    margin-left:8px;
  }

  /* ---------------- session log ---------------- */
  .session{
    margin-top: calc(var(--unit)*2);
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--surface);
    padding: calc(var(--unit)*2);
  }
  .session-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: calc(var(--unit)*2);
  }
  .take{
    display:grid;
    grid-template-columns: 40px 1fr 140px 56px 34px 34px;
    align-items:center;
    gap:14px;
    padding: 12px 4px;
    border-top:1px solid var(--border);
  }
  .take:first-of-type{ border-top:none; }
  @media (max-width:640px){
    .take{ grid-template-columns: 34px 1fr 34px 34px; }
    .take .take-wave, .take .take-dur{ display:none; }
  }
  .take-num{
    font-family:var(--font-mono);
    font-size:0.75rem;
    color:var(--text-tertiary);
  }
  .take-name{
    background:transparent;
    border:1px solid transparent;
    border-radius:2px;
    color:var(--text-primary);
    font-family:var(--font-ui);
    font-size:0.875rem;
    padding:4px 6px;
    width:100%;
  }
  .take-name:hover, .take-name:focus{ border-color: var(--border-strong); }
  .take-wave{
    display:flex; align-items:flex-end; gap:2px; height:26px;
  }
  .take-wave span{
    width:3px; background:var(--idle); border-radius:1px;
    transition: background-color .12s ease;
  }
  .take-wave.playing span{ background: var(--success); }
  .take-dur{
    font-family:var(--font-mono);
    font-size:0.75rem;
    color:var(--text-secondary);
    text-align:right;
  }
  .take-play, .take-del{
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    border:1px solid var(--border);
    border-radius:var(--radius);
    color:var(--text-secondary);
    cursor:pointer;
  }
  .take-play:hover{ border-color: var(--success); color:var(--success); }
  .take-del:hover{ border-color: var(--warn); color:var(--warn); }
  .take-play svg, .take-del svg{ width:12px; height:12px; }

  .empty-state{
    font-family:var(--font-mono);
    font-size:0.8125rem;
    color:var(--text-tertiary);
    padding: calc(var(--unit)*2) 4px;
  }

  .footer-note{
    margin-top: calc(var(--unit)*3);
    text-align:center;
    font-family:var(--font-mono);
    font-size:0.6875rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-tertiary);
  }

  .toast{
    position:fixed;
    bottom:20px; left:50%;
    transform: translateX(-50%) translateY(8px);
    background:var(--surface-raised);
    border:1px solid var(--border-strong);
    color:var(--text-primary);
    font-family:var(--font-mono);
    font-size:0.75rem;
    padding:10px 16px;
    border-radius:var(--radius);
    opacity:0;
    pointer-events:none;
    transition: opacity .18s ease, transform .18s ease;
    z-index:10;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:0.001ms !important; animation-duration:0.001ms !important; }
  }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
</style>
</head>
<body>

<div class="shell">

  <header class="topbar">
    <div class="wordmark">
      <h1>OUTBOARD</h1>
      <span class="sub">Text&#8209;to&#8209;music console</span>
    </div>
    <div class="topbar-right">
      <span class="pwr"><span class="led"></span>PWR</span>
      <span class="theme-badge">DARK</span>
    </div>
  </header>

  <main class="rack">

    <!-- CH.01 — INPUT -->
    <section class="panel panel-input">
      <span class="eyebrow"><span class="dot" style="background:var(--teal)"></span>CH.01 — INPUT</span>
      <label for="prompt" class="sr-only">Describe a sound</label>
      <textarea id="prompt" placeholder="slow-motion 80s synth ballad, warm tape hiss, rain on the window"></textarea>
      <div class="charcount"><span id="charcount">0</span> / 400</div>

      <div class="field-group">
        <span class="field-label">Genre</span>
        <div class="chips" data-group="genre">
          <button class="chip" aria-pressed="false">Lo-fi</button>
          <button class="chip" aria-pressed="false">Synthwave</button>
          <button class="chip" aria-pressed="false">Ambient</button>
          <button class="chip" aria-pressed="false">Techno</button>
          <button class="chip" aria-pressed="false">Jazz</button>
          <button class="chip" aria-pressed="false">Cinematic</button>
          <button class="chip" aria-pressed="false">Folk</button>
          <button class="chip" aria-pressed="false">Hip-Hop</button>
        </div>
      </div>

      <div class="field-group">
        <span class="field-label">Mood</span>
        <div class="chips" data-group="mood">
          <button class="chip" aria-pressed="false">Melancholy</button>
          <button class="chip" aria-pressed="false">Euphoric</button>
          <button class="chip" aria-pressed="false">Dreamy</button>
          <button class="chip" aria-pressed="false">Tense</button>
          <button class="chip" aria-pressed="false">Nostalgic</button>
          <button class="chip" aria-pressed="false">Aggressive</button>
        </div>
      </div>
    </section>

    <!-- MASTER OUT -->
    <section class="panel panel-master">
      <span class="eyebrow"><span class="dot" id="rec-dot" style="background:var(--idle)"></span>MASTER OUT</span>

      <div class="meter" id="meter" aria-hidden="true"></div>

      <button class="generate-btn" id="generate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l14 8-14 8V4z" fill="currentColor" stroke="none"/></svg>
        <span id="generate-label">Generate</span>
      </button>

      <div class="status-line" role="status" aria-live="polite">
        <span id="status-text">READY</span> <span class="timer" id="status-timer"></span>
      </div>
    </section>

    <!-- CH.02 — RACK -->
    <section class="panel panel-rack">
      <span class="eyebrow"><span class="dot" style="background:var(--violet)"></span>CH.02 — RACK</span>

      <div class="field-group">
        <div class="rack-row">
          <span class="field-label">BPM</span>
          <input type="range" id="bpm" min="60" max="180" value="96">
          <span class="bpm-value" id="bpm-value">96</span>
        </div>

        <div class="rack-row">
          <span class="field-label">Length</span>
          <div class="segmented" data-group="length">
            <button aria-pressed="false" data-val="0:15">15s</button>
            <button aria-pressed="true" data-val="0:30">30s</button>
            <button aria-pressed="false" data-val="1:00">1m</button>
            <button aria-pressed="false" data-val="2:00">2m</button>
          </div>
        </div>

        <div class="rack-row">
          <span class="field-label">Key</span>
          <select id="key">
            <option>C Major</option>
            <option>A Minor</option>
            <option>G Major</option>
            <option>E Minor</option>
            <option>D Major</option>
            <option>F# Minor</option>
          </select>
        </div>

        <div class="rack-row">
          <span class="field-label">Model</span>
          <select id="model">
            <option>Outboard-1</option>
            <option>Outboard-1 HD</option>
            <option>Outboard Live</option>
          </select>
        </div>

        <div class="rack-row">
          <span class="field-label">Seed</span>
          <div class="seed-row">
            <input type="text" id="seed" value="402951" inputmode="numeric">
            <button class="icon-btn" id="shuffle-seed" aria-label="Randomize seed">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4M3 7h13M7 21l-4-4 4-4M21 17H8"/></svg>
            </button>
          </div>
        </div>

        <div class="rack-row toggle-row">
          <span class="field-label">Vocals</span>
          <div style="display:flex;align-items:center;">
            <button class="toggle" id="vocals-toggle" aria-pressed="true" aria-label="Vocals on"><span class="knob"></span></button>
            <span class="toggle-label" id="vocals-label">On</span>
          </div>
        </div>
      </div>
    </section>

  </main>

  <section class="session">
    <div class="session-head">
      <span class="eyebrow"><span class="dot" style="background:var(--green)"></span>SESSION LOG</span>
    </div>
    <div id="takes"></div>
    <div class="empty-state" id="empty-state">No takes yet — describe a sound above and press Generate.</div>
  </section>

  <p class="footer-note">Outboard — local session, nothing leaves your browser</p>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  // ---- chip toggles (multi-select) ----
  document.querySelectorAll('.chips').forEach(function(group){
    group.addEventListener('click', function(e){
      var btn = e.target.closest('.chip');
      if(!btn) return;
      btn.setAttribute('aria-pressed', btn.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
    });
  });

  // ---- segmented control (single-select) ----
  document.querySelectorAll('.segmented').forEach(function(group){
    group.addEventListener('click', function(e){
      var btn = e.target.closest('button');
      if(!btn) return;
      group.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed','false'); });
      btn.setAttribute('aria-pressed','true');
    });
  });

  // ---- BPM slider ----
  var bpm = document.getElementById('bpm');
  var bpmValue = document.getElementById('bpm-value');
  bpm.addEventListener('input', function(){ bpmValue.textContent = bpm.value; });

  // ---- seed shuffle ----
  document.getElementById('shuffle-seed').addEventListener('click', function(){
    document.getElementById('seed').value = String(Math.floor(100000 + Math.random()*899999));
    showToast('Seed randomized');
  });

  // ---- vocals toggle ----
  var vocalsBtn = document.getElementById('vocals-toggle');
  var vocalsLabel = document.getElementById('vocals-label');
  vocalsBtn.addEventListener('click', function(){
    var on = vocalsBtn.getAttribute('aria-pressed') === 'true';
    vocalsBtn.setAttribute('aria-pressed', on ? 'false' : 'true');
    vocalsBtn.setAttribute('aria-label', on ? 'Vocals off' : 'Vocals on');
    vocalsLabel.textContent = on ? 'Off' : 'On';
  });

  // ---- prompt char count ----
  var prompt = document.getElementById('prompt');
  var charcount = document.getElementById('charcount');
  prompt.addEventListener('input', function(){
    var v = prompt.value.slice(0,400);
    if(prompt.value.length > 400) prompt.value = v;
    charcount.textContent = prompt.value.length;
  });

  // ---- meter ----
  var meterEl = document.getElementById('meter');
  var METER_BARS = 42;
  for(var i=0;i<METER_BARS;i++){
    var bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = '4px';
    meterEl.appendChild(bar);
  }
  var bars = meterEl.querySelectorAll('.bar');
  var idleTick = 0;
  var rendering = false;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function idleFrame(){
    idleTick++;
    bars.forEach(function(b, i){
      var h = 4 + Math.abs(Math.sin((idleTick/14) + i*0.5)) * 10;
      b.style.height = h + 'px';
      b.style.background = 'var(--idle)';
    });
  }
  if(!reduceMotion){ setInterval(idleFrame, 220); } else { idleFrame(); }

  function renderFrame(){
    bars.forEach(function(b){
      var laneRoll = Math.random();
      var lane = laneRoll < 0.5 ? 0 : laneRoll < 0.75 ? 1 : laneRoll < 0.9 ? 2 : laneRoll < 0.98 ? 3 : 4;
      var h = 6 + Math.random()*104;
      b.style.height = h + 'px';
      b.style.background = ['var(--idle)','var(--success)','var(--ai)','var(--action)','var(--warn)'][lane];
    });
  }

  function settleFrame(seedShape){
    bars.forEach(function(b, i){
      var h = seedShape[i];
      b.style.height = h + 'px';
      b.style.background = h > 70 ? 'var(--action)' : h > 40 ? 'var(--success)' : 'var(--idle)';
    });
  }

  // ---- generate flow ----
  var genBtn = document.getElementById('generate');
  var genLabel = document.getElementById('generate-label');
  var statusText = document.getElementById('status-text');
  var statusTimer = document.getElementById('status-timer');
  var recDot = document.getElementById('rec-dot');
  var takesEl = document.getElementById('takes');
  var emptyState = document.getElementById('empty-state');
  var takeCount = 0;

  function fmtLen(sec){
    var m = Math.floor(sec/60), s = sec%60;
    return m + ':' + (s<10?'0':'') + s;
  }
  function lenToSeconds(str){
    var parts = str.split(':');
    return parseInt(parts[0],10)*60 + parseInt(parts[1],10);
  }

  function buildMiniWave(seed){
    var frag = document.createElement('div');
    frag.className = 'take-wave';
    for(var i=0;i<24;i++){
      var span = document.createElement('span');
      var h = 3 + Math.abs(Math.sin(seed + i*0.7))*20;
      span.style.height = h + 'px';
      frag.appendChild(span);
    }
    return frag;
  }

  function addTake(){
    takeCount++;
    emptyState.style.display = 'none';

    var lenBtn = document.querySelector('.segmented[data-group="length"] button[aria-pressed="true"]');
    var lenStr = lenBtn ? lenBtn.dataset.val : '0:30';

    var row = document.createElement('div');
    row.className = 'take';
    row.innerHTML =
      '<span class="take-num">T' + String(takeCount).padStart(2,'0') + '</span>' +
      '<input class="take-name" value="Untitled Take ' + String(takeCount).padStart(2,'0') + '" aria-label="Take name">' +
      '<span class="take-dur">' + lenStr + '</span>' +
      '<button class="take-play" aria-label="Play take"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8V4z"/></svg></button>' +
      '<button class="take-del" aria-label="Remove take"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>';

    var wave = buildMiniWave(takeCount * 1.3);
    row.insertBefore(wave, row.children[2]);

    takesEl.insertBefore(row, takesEl.firstChild);

    // play/pause simulation
    var playBtn = row.querySelector('.take-play');
    var waveEl = row.querySelector('.take-wave');
    var durSec = lenToSeconds(lenStr);
    var playing = false, elapsed = 0, playInterval = null;
    playBtn.addEventListener('click', function(){
      playing = !playing;
      if(playing){
        playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
        waveEl.classList.add('playing');
        elapsed = 0;
        playInterval = setInterval(function(){
          elapsed++;
          if(elapsed >= durSec){
            playing = false;
            playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8V4z"/></svg>';
            waveEl.classList.remove('playing');
            clearInterval(playInterval);
          }
        }, 1000);
      } else {
        playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8V4z"/></svg>';
        waveEl.classList.remove('playing');
        clearInterval(playInterval);
      }
    });

    row.querySelector('.take-del').addEventListener('click', function(){
      clearInterval(playInterval);
      var name = row.querySelector('.take-name').value || 'Take';
      row.remove();
      if(!takesEl.children.length){ emptyState.style.display = 'block'; }
      showToast(name + ' removed');
    });
  }

  genBtn.addEventListener('click', function(){
    if(rendering) return;
    rendering = true;
    genBtn.disabled = true;
    recDot.style.background = 'var(--action)';
    recDot.style.boxShadow = '0 0 6px color-mix(in srgb, var(--action) 70%, transparent)';
    statusText.textContent = 'RENDERING…';

    var elapsed = 0;
    var total = 3.6;
    var start = Date.now();

    var renderInterval = reduceMotion ? null : setInterval(renderFrame, 90);
    var timerInterval = setInterval(function(){
      elapsed = (Date.now() - start) / 1000;
      statusTimer.textContent = elapsed.toFixed(1) + 's';
      if(elapsed >= total){
        clearInterval(timerInterval);
        if(renderInterval) clearInterval(renderInterval);

        var seedShape = [];
        for(var i=0;i<METER_BARS;i++){ seedShape.push(6 + Math.abs(Math.sin(i*0.5 + Math.random()*2))*90); }
        settleFrame(seedShape);

        statusText.textContent = 'COMPLETE';
        statusTimer.textContent = '';
        recDot.style.background = 'var(--idle)';
        recDot.style.boxShadow = 'none';
        genBtn.disabled = false;
        rendering = false;
        addTake();

        setTimeout(function(){
          if(!rendering){ statusText.textContent = 'READY'; idleFrame(); }
        }, 2200);
      }
    }, 60);
  });

  // ---- toast ----
  var toast = document.getElementById('toast');
  var toastTimeout;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(function(){ toast.classList.remove('show'); }, 2200);
  }
})();
</script>

</body>
</html>
