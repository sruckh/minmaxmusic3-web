<!doctype html>
<html lang="en">
<head>{{template "head" .}}</head>
<body>
<div class="shell">
  {{template "nav" .}}
  <main class="session">
    <div class="session-head">
      <div style="display:flex; align-items:center; gap:12px;">
        <span class="eyebrow"><span class="dot" style="background:var(--green)"></span>ACCESS</span>
        <h1 style="font-family:var(--font-display); font-size:1.2rem; font-weight:500; margin:0">Request access</h1>
      </div>
    </div>

    {{if .Notice}}<p class="notice" role="status">{{.Notice}}</p>{{end}}

    <form method="post" action="/register" class="auth-form">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username"
             minlength="3" maxlength="64" value="{{.Username}}" required autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="new-password" minlength="8" maxlength="72" required>

      <label for="confirm_password">Confirm password</label>
      <input id="confirm_password" name="confirm_password" type="password"
             autocomplete="new-password" minlength="8" maxlength="72" required>

      <button class="btn" type="submit">Request access</button>
    </form>

    <p class="footer-note">
      Accounts start as pending. An administrator must approve yours before you
      can sign in. Already have one? <a href="/login">Sign in</a>.
    </p>
  </main>

  <p class="footer-note">MM3 — songs are stored on this server and stay private until you share them</p>
</div>
</body>
</html>
