name: mm3

# The restore, litestream and files-sync services differ only in `command`.
# They authenticate to Infisical exactly as the app does; the replica
# credentials (MM3_LS_BUCKET, MM3_LS_ENDPOINT, MM3_LS_REGION, MM3_LS_KEY_ID,
# MM3_LS_APP_KEY) arrive only via infisical run, never from here.
x-backup: &backup
  image: mm3-backup:latest
  networks:
    - shared_net
  environment:
    INFISICAL_DOMAIN: ${INFISICAL_HOST:-}
    INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
    INFISICAL_ENV: ${INFISICAL_ENV:-dev}
    INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
    INFISICAL_CLIENT_SECRET_FILE: /run/secrets/infisical_client_secret
  secrets:
    - infisical_client_secret
  volumes:
    - data:/data

services:
  # Runs to completion before anything else touches /data. Restores the
  # database and audio from the off-host replica when the volume is empty, and
  # does nothing when it is not. If the replica cannot be read it exits
  # non-zero and the app never starts — see docker/restore.sh.
  restore:
    <<: *backup
    build:
      context: .
      target: backup
    container_name: mm3-restore
    restart: "no"
    command: ["/usr/local/bin/restore.sh"]

  # Continuous replication of /data/mm3.db (docker/litestream.yml).
  litestream:
    <<: *backup
    container_name: mm3-litestream
    restart: unless-stopped
    command: ["litestream", "replicate", "-config", "/etc/litestream.yml"]
    depends_on:
      restore:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/metrics"]
      interval: 30s
      timeout: 3s
      start_period: 15s

  # Audio and uploads, every MM3_FILES_SYNC_INTERVAL seconds (default 900).
  # Each pass lists the prefix back and logs the object count and byte total,
  # so "the copy did not error" is not mistaken for "the bucket holds the
  # songs" — rclone copy exits 0 when it has nothing to do.
  files-sync:
    <<: *backup
    container_name: mm3-files-sync
    restart: unless-stopped
    command: ["/usr/local/bin/files-sync.sh"]
    depends_on:
      restore:
        condition: service_completed_successfully

  app:
    build:
      context: .
      target: runtime
    image: mm3-web:latest
    container_name: mm3-app
    restart: unless-stopped
    # Deliberately no `ports:` — reachable only on shared_net, where Nginx
    # Proxy Manager forwards its public vhost to it and Cloudflare
    # terminates TLS in front of that.
    expose:
      - "8080"
    networks:
      - shared_net
    environment:
      # Canonical external origin, trusted for same-origin write checks.
      # scripts/env.sh exports it from the operator's local
      # ~/.config/mm3-web-infisical/infisical.env; it identifies this
      # deployment and is never committed. Omitting it falls back to
      # request-Host trust.
      MM3_PUBLIC_URL: ${MM3_PUBLIC_URL:-}
      MM3_MAX_IN_FLIGHT: ${MM3_MAX_IN_FLIGHT:-2}
      # The header the rate limits read the visitor's address from. Cloudflare
      # sets CF-Connecting-IP itself, overwriting any client value. Only valid
      # while the proxy host accepts traffic from Cloudflare alone: reachable
      # directly, a client could send its own value and dodge the limits.
      MM3_CLIENT_IP_HEADER: ${MM3_CLIENT_IP_HEADER:-CF-Connecting-IP}
      # Universal Auth machine identity — the entrypoint trades these for a
      # short-lived token and runs the app under `infisical run`, which puts
      # the app secrets straight into the app's environment. Export them into
      # your shell before `docker compose up` (see scripts/env.sh); never
      # commit them. App secrets themselves are NOT listed here — they arrive
      # only via infisical run, and the full set is:
      #
      #   LLM_BASE_URL, LLM_API_KEY, LLM_MODEL_ID   — assistant
      #   RUNPOD_ENDPOINT, RUNPOD_API_KEY           — inference
      #   ADMIN_USER, ADMIN_PASSWORD                — administrator sign-in
      #   MM3_LS_BUCKET, MM3_LS_ENDPOINT, MM3_LS_REGION,
      #   MM3_LS_KEY_ID, MM3_LS_APP_KEY             — off-host backup
      #
      # The MM3_LS_* set is the opposite of the admin pair: without it the
      # `restore` service exits non-zero and nothing starts, the app included.
      #
      # ADMIN_USER and ADMIN_PASSWORD are the dangerous omission. Missing
      # RUNPOD_*/LLM_* fails loudly the first time someone generates; missing
      # admin credentials fails silently — the container passes its health
      # check, accepts registrations, and has NO administrator, so no account
      # can ever be approved. There is no default and no bootstrap flag; the
      # only fix is to set both in Infisical and restart. After every deploy,
      # confirm `admin_login=true` in the `config loaded` log line:
      #
      #   docker logs mm3-app --tail 20 | grep admin_login
      #
      # See README.md § Authentication & Administration.
      INFISICAL_DOMAIN: ${INFISICAL_HOST:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-dev}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET_FILE: /run/secrets/infisical_client_secret
    secrets:
      - infisical_client_secret
    volumes:
      - data:/data
    # Never start on an unrestored volume. restore exits 0 when there is
    # nothing to restore, so this only blocks on a real failure.
    depends_on:
      restore:
        condition: service_completed_successfully

  # Toolchain image for running the suite: docker compose run --rm test
  test:
    profiles: ["tools"]
    build:
      context: .
      target: test
    image: mm3-web-test:latest

networks:
  shared_net:
    external: true

volumes:
  data:

# Plaintext exists only in /dev/shm long enough for Compose to create the
# read-only bind mount. scripts/up.sh creates and unlinks it.
secrets:
  infisical_client_secret:
    file: ${INFISICAL_CLIENT_SECRET_FILE:?run scripts/up.sh (or source scripts/env.sh) first}
